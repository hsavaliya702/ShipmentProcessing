name: Deploy Subscriber Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'src/ShipmentTracking.Subscriber/**'
      - 'src/ShipmentTracking.Common/**'
      - 'infrastructure/subscriber-lambda/**'
      - '.github/workflows/deploy-subscriber.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
          - prod

env:
  DOTNET_VERSION: '8.0.x'
  AWS_REGION: 'us-east-1'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ShipmentTracking.sln

      - name: Build solution
        run: dotnet build ShipmentTracking.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ShipmentTracking.sln --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload code coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: '**/coverage.cobertura.xml'
          flags: subscriber

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build for CodeQL
        run: dotnet build ShipmentTracking.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    environment:
      name: dev
      url: https://console.aws.amazon.com/lambda/home?region=us-east-1#/functions/shipment-tracking-subscriber-dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda function
        run: |
          cd infrastructure/subscriber-lambda
          sam build --use-container

      - name: Deploy to dev
        run: |
          cd infrastructure/subscriber-lambda
          sam deploy \
            --stack-name shipment-tracking-subscriber-dev \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --resolve-s3

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against dev environment..."
          # Add smoke test commands here

  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event.inputs.environment == 'uat'
    environment:
      name: uat
      url: https://console.aws.amazon.com/lambda/home?region=us-east-1#/functions/shipment-tracking-subscriber-uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_UAT }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_UAT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda function
        run: |
          cd infrastructure/subscriber-lambda
          sam build --use-container

      - name: Deploy to UAT
        run: |
          cd infrastructure/subscriber-lambda
          sam deploy \
            --stack-name shipment-tracking-subscriber-uat \
            --parameter-overrides Environment=uat \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --resolve-s3

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-uat
    if: github.event.inputs.environment == 'prod'
    environment:
      name: prod
      url: https://console.aws.amazon.com/lambda/home?region=us-east-1#/functions/shipment-tracking-subscriber-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda function
        run: |
          cd infrastructure/subscriber-lambda
          sam build --use-container

      - name: Deploy to Production
        run: |
          cd infrastructure/subscriber-lambda
          sam deploy \
            --stack-name shipment-tracking-subscriber-prod \
            --parameter-overrides Environment=prod \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --resolve-s3

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Add verification commands here

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: subscriber-${{ github.run_number }}
          release_name: Subscriber Lambda v${{ github.run_number }}
          body: |
            Automated deployment of Subscriber Lambda to production
            
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
